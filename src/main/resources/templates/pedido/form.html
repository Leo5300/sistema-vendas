<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('pedidos')}"></div>
<div class="container mt-4">
    <h1>Novo Pedido</h1>

    <div class="alert alert-warning" th:if="${#lists.isEmpty(clientes)}">
        Nenhum cliente cadastrado. <a th:href="@{/clientes/novo}">Cadastre um cliente</a> antes de criar um pedido.
    </div>

    <form th:action="@{/pedidos/novo}" method="post">
        <div class="mb-3">
            <label for="clienteId" class="form-label">Cliente</label>
            <select id="clienteId" name="clienteId" class="form-select" required>
                <option value="">Selecione um cliente</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nome + ' - ' + cliente.cpf}"></option>
            </select>
        </div>

        <p class="text-muted">Depois de criar o pedido você poderá adicionar os produtos.</p>

        <button type="submit" class="btn btn-primary">Criar Pedido</button>
        <a th:href="@{/pedidos}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
