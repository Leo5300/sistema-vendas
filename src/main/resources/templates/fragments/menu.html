<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<body>
<nav th:fragment="menu(ativo)" class="navbar navbar-expand navbar-dark menu">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Sistema de Vendas</a>
        <ul class="navbar-nav ms-auto gap-1 align-items-center">
            <!-- Cadastros: visíveis apenas para ADMIN -->
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link px-3" th:href="@{/clientes}"
                   th:classappend="${ativo == 'clientes'} ? 'active'">Clientes</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link px-3" th:href="@{/produtos}"
                   th:classappend="${ativo == 'produtos'} ? 'active'">Produtos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-3" th:href="@{/pedidos}"
                   th:classappend="${ativo == 'pedidos'} ? 'active'">Pedidos</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <span class="navbar-text px-2 text-white-50 small" sec:authentication="principal.nome"></span>
            </li>
            <!-- Link para a página de logout (GET /logout); o POST fica nessa página -->
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link px-3" th:href="@{/logout}">Sair</a>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
